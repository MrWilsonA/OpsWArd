apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsward.fullname" . }}-kafka-headless
  labels:
    {{- include "opsward.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "opsward.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsward.fullname" . }}-kafka
spec:
  selector:
    {{- include "opsward.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports: [{name: broker, port: 9092}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opsward.fullname" . }}-kafka
spec:
  serviceName: {{ include "opsward.fullname" . }}-kafka-headless
  replicas: {{ .Values.kafka.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "opsward.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "opsward.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.{{ include "opsward.fullname" . }}-kafka-headless.${POD_NAMESPACE}.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }}}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@{{ include "opsward.fullname" . }}-kafka-0.{{ include "opsward.fullname" . }}-kafka-headless:9093,1@{{ include "opsward.fullname" . }}-kafka-1.{{ include "opsward.fullname" . }}-kafka-headless:9093,2@{{ include "opsward.fullname" . }}-kafka-2.{{ include "opsward.fullname" . }}-kafka-headless:9093"
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "2"}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          readinessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /tmp/kraft-combined-logs}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.kafka.storage }}}}
