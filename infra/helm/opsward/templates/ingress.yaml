{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opsward.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecretName }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "opsward.fullname" . }}-backend, port: {name: http}}}
          - path: /socket
            pathType: Prefix
            backend: {service: {name: {{ include "opsward.fullname" . }}-backend, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "opsward.fullname" . }}-frontend, port: {name: http}}}
{{- end }}
