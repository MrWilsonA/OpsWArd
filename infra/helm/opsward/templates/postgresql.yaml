apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsward.fullname" . }}-postgresql
  labels:
    {{- include "opsward.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "opsward.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opsward.fullname" . }}-postgresql
spec:
  serviceName: {{ include "opsward.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "opsward.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "opsward.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "opsward.fullname" . }}-secrets, key: postgres-password}}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgresql.storage }}}}
