apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsward.fullname" . }}-livekit
type: Opaque
stringData:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: {{ .Values.livekit.rtcUdpStart }}
      port_range_end: {{ .Values.livekit.rtcUdpEnd }}
      use_external_ip: true
    redis:
      address: {{ include "opsward.fullname" . }}-redis:6379
    keys:
      {{ .Values.livekit.apiKey }}: {{ .Values.livekit.apiSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsward.fullname" . }}-livekit
spec:
  selector:
    {{- include "opsward.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
  ports:
    - {name: signal, port: 7880}
    - {name: rtc-tcp, port: 7881}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsward.fullname" . }}-livekit
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "opsward.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: livekit
  template:
    metadata:
      labels:
        {{- include "opsward.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "opsward.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: livekit
              topologyKey: kubernetes.io/hostname
      containers:
        - name: livekit
          image: {{ .Values.livekit.image | quote }}
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - {name: signal, containerPort: 7880}
            - {name: rtc-tcp, containerPort: 7881}
          readinessProbe: {httpGet: {path: /, port: signal}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts: [{name: config, mountPath: /etc/livekit, readOnly: true}]
      volumes: [{name: config, secret: {secretName: {{ include "opsward.fullname" . }}-livekit}}]
