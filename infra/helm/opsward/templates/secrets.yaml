apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsward.fullname" . }}-secrets
  labels:
    {{- include "opsward.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgresql.password is required" .Values.postgresql.password | quote }}
  secret-key-base: {{ required "backend.secretKeyBase is required" .Values.backend.secretKeyBase | quote }}
  release-cookie: {{ required "backend.releaseCookie is required" .Values.backend.releaseCookie | quote }}
  opsward-api-key: {{ .Values.backend.apiKey | quote }}
  livekit-api-key: {{ required "livekit.apiKey is required" .Values.livekit.apiKey | quote }}
  livekit-api-secret: {{ required "livekit.apiSecret is required" .Values.livekit.apiSecret | quote }}
