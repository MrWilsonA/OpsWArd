openapi: 3.1.0
info:
  title: OpsWArd Command API
  version: 0.1.0
  license:
    name: ISC
    identifier: ISC
servers:
  - url: /api/v1
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Incident:
      type: object
      required: [id, title, severity, status, declared_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: [string, "null"]}
        severity: {type: string, enum: [low, medium, high, critical]}
        status: {type: string, enum: [declared, investigating, mitigated, resolved]}
        commander: {type: [string, "null"]}
        metadata: {type: object, additionalProperties: true}
        declared_at: {type: string, format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
    IncidentCreate:
      type: object
      required: [title, severity]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1}
        description: {type: [string, "null"]}
        severity: {type: string, enum: [low, medium, high, critical]}
        commander: {type: [string, "null"]}
        metadata: {type: object, additionalProperties: true}
    TelemetryEvent:
      type: object
      required: [event_id, source, kind, payload]
      properties:
        event_id: {type: string}
        source: {type: string}
        kind: {type: string}
        payload: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
    PlaybookRunRequest:
      type: object
      required: [playbook]
      properties:
        playbook: {type: string, enum: [database_failover, kubernetes_healing]}
        context: {type: object, additionalProperties: true}
security:
  - ApiKey: []
paths:
  /health:
    get:
      summary: Check service health
      security: []
      operationId: health
      responses:
        "200": {description: Healthy}
        "503": {description: Degraded}
  /metrics:
    get:
      summary: Read Prometheus metrics
      security: []
      operationId: metrics
      responses:
        "200": {description: Prometheus text exposition}
  /incidents:
    get:
      summary: List incidents
      operationId: listIncidents
      responses:
        "200": {description: Incident list}
    post:
      summary: Declare an incident
      operationId: declareIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidentCreate"}
      responses:
        "201": {description: Incident declared}
        "422": {description: Invalid incident}
  /incidents/{id}/resolve:
    post:
      summary: Resolve an incident
      operationId: resolveIncident
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Incident resolved}
        "404": {description: Not found}
  /playbooks:
    get:
      summary: List available playbooks
      operationId: listPlaybooks
      responses: {"200": {description: Playbook definitions}}
  /playbook-runs:
    post:
      summary: Start a playbook run
      operationId: startPlaybook
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PlaybookRunRequest"}}}
      responses:
        "202": {description: Playbook accepted}
  /playbook-runs/{id}:
    get:
      summary: Get a playbook run
      operationId: getPlaybookRun
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Run and step state}
        "404": {description: Not found}
  /telemetry:
    post:
      summary: Ingest a telemetry event
      operationId: ingestTelemetry
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TelemetryEvent"}}}
      responses: {"202": {description: Accepted}, "422": {description: Invalid event}}
  /telemetry/dlq:
    get:
      summary: List dead-letter entries
      operationId: listDlq
      responses: {"200": {description: Unreplayed DLQ entries}}
  /telemetry/dlq/{id}/replay:
    post:
      summary: Replay a dead-letter entry
      operationId: replayDlq
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Replayed}, "404": {description: Not found}, "503": {description: Kafka unavailable}}
  /consensus:
    get:
      summary: Read consensus status
      operationId: consensusStatus
      responses: {"200": {description: Raft or local ledger status}}
  /media/token:
    post:
      summary: Issue a LiveKit room token
      operationId: issueLiveKitToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, room]
              properties:
                identity: {type: string}
                room: {type: string}
                metadata: {type: object, additionalProperties: true}
      responses: {"200": {description: Room-scoped token}}
  /spatial/proximity:
    post:
      summary: Calculate spatial-audio proximity
      operationId: calculateProximity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: array, prefixItems: [{type: number}, {type: number}], minItems: 2, maxItems: 2}
                to: {type: array, prefixItems: [{type: number}, {type: number}], minItems: 2, maxItems: 2}
      responses: {"200": {description: Normalized gain}}
