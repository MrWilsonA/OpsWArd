syntax = "proto3";

package opsward.v1;

service CommandService {
  rpc DeclareIncident (DeclareIncidentRequest) returns (CommandReply);
  rpc ConsensusStatus (StatusRequest) returns (StatusReply);
}

message DeclareIncidentRequest {
  string title = 1;
  string description = 2;
  string severity = 3;
  string actor = 4;
}

message CommandReply {
  string id = 1;
  string status = 2;
  string error = 3;
}

message StatusRequest {}

message StatusReply {
  string json = 1;
}
